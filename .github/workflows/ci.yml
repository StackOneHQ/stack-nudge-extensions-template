# CI on pull requests and main: the same parts as scripts/check.sh. After agent-control's.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the run in progress on it. On main every run finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The extension version check compares with the base, so it needs the history.
          fetch-depth: 0
          persist-credentials: false

      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # A runner has no terminal to answer pnpm's question before it replaces a node_modules.
      - name: Install
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false

      # Lint, packaging, the extensions' tests and versions, the script specs, the workflow pins,
      # shellcheck and actionlint.
      - name: Checks
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
        run: scripts/check.sh --base "$BASE"
