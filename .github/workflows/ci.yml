# The same checks as stack-nudge's own CI, for the extensions: the pull request's title, then
# validate, test and version-check every extension. `pnpm check` runs these and more locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests squash, so the title becomes the commit on main. Read through the environment,
  # never interpolated into the script.
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Title: $TITLE"
          pattern='^(feat|fix|docs|chore|refactor|test|build|ci|perf|style|revert)(\([a-z0-9._-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title must be a Conventional Commit, 'type: subject' or 'type(scope): subject'."
            exit 1
          fi

  extensions:
    name: validate + test extensions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the version check resolves a merge base, which a shallow clone doesn't have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A reviewer reads a diff, which doesn't show where a symlink points. This is the part of
      # the review nobody can reliably do by eye.
      - name: validate
        run: ./scripts/package-extensions.sh validate

      # test-extensions.sh fails when it finds no suites, which a catalogue with no extensions yet
      # has none of.
      - name: test extensions
        run: |
          if compgen -G 'extensions/*/manifest.json' >/dev/null; then
            ./scripts/test-extensions.sh
          else
            echo "No extensions yet."
          fi

      # stack-nudge compares version strings to decide there's an update, so a changed extension
      # that keeps its version reaches nobody who already has it. The full-history checkout already
      # has the base branch, so nothing is fetched here: with no credentials left behind, a fetch
      # from a private repo would fail.
      - name: check extension versions
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/check-extension-versions.sh "origin/$BASE_REF"
